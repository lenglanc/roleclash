[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lenglanc-roleclash"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告系统提示与用户提示的职责划分相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "lenglanc" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://lenglanc.github.io"
Repository = "https://github.com/lenglanc/roleclash"
Issues = "https://github.com/lenglanc/roleclash/issues"

[project.scripts]
roleclash = "roleclash:main"

[tool.setuptools]
py-modules = ["roleclash"]
